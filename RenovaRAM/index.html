.module-viewport{position:relative;z-index:2;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-color:#20647d transparent;scrollbar-width:thin;padding:8px 5px 27px}.modules{display:flex;align-items:stretch;justify-content:center;gap:clamp(12px,2.6vw,34px);min-width:max-content;min-height:330px}.module{position:relative;width:clamp(170px,17.7vw,220px);flex:0 0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;--liquid-color:#438bf8;--light-color:#2ee5ef}.module:nth-child(even){--liquid-color:#755cef;--light-color:#ce92ff}.module figcaption{width:100%;color:#a5dff1;font-size:10px;letter-spacing:.13em;font-weight:750;min-height:18px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.module svg{width:min(100%,164px);height:282px;overflow:visible;filter:drop-shadow(0 0 16px #1bd5ef22);flex-shrink:0}.module .fluid{transition:transform 2.3s cubic-bezier(.13,.85,.2,1)}.module .wave{animation:wavemove 3.4s linear infinite}.module .wave.back{animation-duration:5.2s;opacity:.55}.module .steam{opacity:0;transition:opacity .35s}.module.vapor .steam{opacity:1}.module .steam circle{animation:rise 1.5s ease-out infinite;opacity:0}.module .steam circle:nth-child(2){animation-delay:.25s}.module .steam circle:nth-child(3){animation-delay:.55s}.module .steam circle:nth-child(4){animation-delay:.83s}.module .ghost{opacity:0;transition:opacity .45s}.module.has-result .ghost{opacity:.9}.pct-label{font-size:30px;fill:#efffff;font-weight:820;letter-spacing:-1.2px;text-anchor:middle;paint-order:stroke;stroke:#00233b;stroke-width:2.7px}.small-label{font-size:10px;fill:#d0fcff;text-anchor:middle;font-weight:700;letter-spacing:.07em}.mem-cap{color:#f1fbff;font-weight:820;font-size:17px;line-height:1.1}.mem-loc{color:#75a7c0;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sensor-note{font-size:10px;opacity:.8}

@media(max-width:650px){.stage{padding:18px 11px 20px}.brand-row{gap:10px}.emblem{height:54px;width:54px}.emblem svg{height:43px;width:43px}h1{font-size:clamp(30px,8.7vw,46px)}.signature{letter-spacing:.13em;font-size:10px}.release{min-width:220px;padding:11px 22px}.board{padding:17px 11px;min-height:435px;border-radius:18px}.module{width:164px}.module-viewport{padding:10px 0 26px}.modules{justify-content:flex-start}.module svg{height:260px}.board-top .headline{font-size:11px}.note{max-width:65%}.board-foot{font-size:10px}.pipe{max-width:95%}}

<script>
(()=>{'use strict';
 const $=s=>document.getElementById(s), API='http://127.0.0.1:18867', demo=new URLSearchParams(location.search).get('demo')==='1', reduced=matchMedia('(prefers-reduced-motion: reduce)');
 const board=$('board'), models=$('modules'), button=$('release'); let connected=false,busy=false,snapshot=null,beginning=null,resultTimer=0,setupPending=false,checkingSetup=false,setupWatcher=null;
 const clean=s=>String(s??'').slice(0,72).replace(/[<>]/g,'');
 const fmt=x=>Number(x).toLocaleString('es-CO',{minimumFractionDigits:1,maximumFractionDigits:2});
 const sleep=n=>new Promise(resolve=>setTimeout(resolve,n));
 function buildSvg(i){const c='m'+i;return `<svg viewBox="0 0 165 290" role="img" aria-label="Módulo de memoria representado con líquido">
 <defs><clipPath id="clip-${c}"><rect x="26" y="19" width="112" height="239" rx="12"/></clipPath><linearGradient id="glass-${c}" x1="0" x2="1"><stop stop-color="#b7f9ff" stop-opacity=".18"/><stop offset=".3" stop-color="#092f56" stop-opacity="0"/><stop offset="1" stop-color="#35faff" stop-opacity=".19"/></linearGradient><linearGradient id="fill-${c}" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#2ce6fc"/><stop offset="1" stop-color="#6c58f4"/></linearGradient></defs>
 <path d="M22 5 H141 L151 15 V256 L141 268 H22 L14 259 V15 Z" fill="#041d32" stroke="#43dfff" stroke-width="2.1"/><g fill="#e9b85b">${Array.from({length:17},(_,z)=>`<rect x="9" y="${26+z*12.6}" width="8" height="6" rx="1"/>`).join('')}</g><g stroke="#165c78" fill="none" stroke-width="1.3" opacity=".7"><path d="M32 22H69V42H97M138 74h-20v22H54V127H27M130 214H95v-23H63M44 260V236h19M118 24v18h-18"/></g>

 <path d="M23 15L29 7H135L143 15V260H23Z" stroke="#71f8ff" stroke-opacity=".75" fill="none" stroke-width="1.7"/>
 <g id="ghost-${c}" class="ghost"><path id="mark-${c}" d="M28 110H137" stroke="#e8ffff" stroke-width="1.8" stroke-dasharray="5 3"/><text id="markText-${c}" x="143" y="107" font-size="10" fill="#a8effd" text-anchor="end">—</text></g>
 <g class="steam" id="steam-${c}"><circle cx="49" cy="180" r="3" fill="#91eaff"/><circle cx="71" cy="160" r="4" fill="#c0ecff"/><circle cx="96" cy="185" r="3" fill="#86b6ff"/><circle cx="113" cy="170" r="4" fill="#91efff"/></g>
 <text x="81" y="144" class="pct-label" id="pct-${c}">—</text><text x="81" y="161" class="small-label">UTILIZADA</text>
 </svg>`;}
 function modal(title,html,actions,kind=''){ $('modal').querySelector('.dialog').classList.toggle('setup-dialog',kind==='setup');$('modalTitle').textContent=title;$('modalBody').innerHTML=html;const wrap=$('modalActions');wrap.replaceChildren();actions.forEach(a=>{let node;if(a.href){node=document.createElement('a');node.className='cta';node.href=a.href;node.download=a.download||'';node.textContent=a.text}else{node=document.createElement('button');node.type='button';node.className=a.secondary?'secondary':'cta';node.textContent=a.text;node.addEventListener('click',a.action)}wrap.append(node)});$('modal').classList.remove('hidden');$('close').focus();}
 function close(){setupPending=false;if(setupWatcher){clearInterval(setupWatcher);setupWatcher=null}$('modal').classList.add('hidden');$('modal').querySelector('.dialog').classList.remove('setup-dialog');button.focus()}$('close').addEventListener('click',close);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').classList.contains('hidden'))close()});
 function instructions(){modal('RenovaRAM · v1.1',`<p><strong>Intención.</strong> Examinar la RAM física y recuperar, cuando sea posible, memoria residente de aplicaciones de usuario sin reiniciar Windows.</p><p><strong>Uso.</strong> 1. Preparar el componente de Windows una sola vez. 2. Abrir RenovaRAM. 3. Presionar <strong>Liberar</strong> y aceptar la autorización nativa. 4. Comparar los niveles medidos antes y después.</p><p>Las gráficas muestran el <strong>uso global</strong> repetido en cada módulo; Windows no publica la ocupación individual de cada tarjeta. El conducto y la evaporación son efectos visuales, no una transferencia física de datos. La intervención puede no cambiar el consumo o ralentizar temporalmente las aplicaciones.</p><p>Diseño: Arley Zarate · Desarrollo: NOVA (IA)<br>Fecha: 23/oct/2026 · Versión: 1.1</p>`,[{text:'Entendido',action:close,secondary:true}])}
 $('info').addEventListener('click',instructions);
 function setup(){
  setupPending=true;
  modal('Conectar con Windows',`<div class="setup-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="14" width="22" height="14" rx="4"/><path d="M11 14v-4a5 5 0 0 1 10 0v4M12 21l3 3 6-7"/></svg></div><p class="setup-lead">RenovaRAM necesita una preparación <strong>única</strong> para acceder a la memoria de Windows.</p><p class="setup-hint">Extraiga el ZIP y abra <strong>Instalar_RenovaRAM.cmd</strong>. Al regresar, se solicitará su autorización para liberar.</p><p id="setupStatus" class="connection-result" role="status" aria-live="polite"></p>`,[
   {text:'Preparar Windows',href:'RenovaRAM_Windows.zip',download:'RenovaRAM_Windows.zip'},
   {text:'Comprobar',action:()=>checkSetupAndContinue(true),secondary:true}
  ],'setup');
  if(setupWatcher)clearInterval(setupWatcher);
  setupWatcher=setInterval(()=>{if(!document.hidden)checkSetupAndContinue(false)},2500);
 }
 async function checkSetupAndContinue(notify=false){
  if(!setupPending||checkingSetup||busy||demo)return;
  checkingSetup=true;
  try{
   await connect();
   close();
   await runRelease();
  }catch(e){if(notify&&setupPending){const status=$('setupStatus');if(status)status.textContent='Aún no se detecta el componente de Windows.'}}
  finally{checkingSetup=false}
 }
 window.addEventListener('focus',()=>{if(setupPending)checkSetupAndContinue(false)});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&setupPending)checkSetupAndContinue(false)});
 function normalize(d){const total=Number(d.totalGiB), used=Number(d.usedGiB), p=Number(d.percent); if(!(total>0&&total<2049&&used>=0&&used<=total*1.02&&p>=0&&p<=100))throw Error('Métricas inválidas'); let mods=Array.isArray(d.modules)?d.modules.slice(0,32):[];mods=mods.filter(x=>Number(x.capacityGiB)>0&&Number(x.capacityGiB)<1025).map(x=>({capacityGiB:Number(x.capacityGiB),locator:clean(x.locator)}));if(!mods.length)mods=[{capacityGiB:total,locator:'Sistema · módulos no disponibles'}];return{totalGiB:total,usedGiB:used,percent:p,modules:mods,availableGiB:Number(d.availableGiB)}}
 function modulesView(s){const existing=[...models.children];const key=s.modules.map(m=>m.locator+'|'+m.capacityGiB).join(' / ');if(models.dataset.key===key&&existing.length)return;models.dataset.key=key;models.replaceChildren();s.modules.forEach((m,i)=>{const el=document.createElement('figure');el.className='module';el.style.margin='0';el.innerHTML=`<figcaption>MÓDULO ${i+1}</figcaption>${buildSvg(i)}<div class="mem-cap">${fmt(m.capacityGiB)} GiB</div><div class="mem-loc"></div>`;el.querySelector('.mem-loc').textContent=m.locator||'Ubicación no identificada';models.append(el)})}
 function level(i,p,initial=false){let svg=$('fluid-m'+i);if(!svg)return;const y=19+239*(1-p/100)-11;svg.style.transform=`translateY(${y.toFixed(2)}px)`;$('pct-m'+i).textContent=`${Math.round(p)}%`;if(initial){const mark=$('mark-m'+i),text=$('markText-m'+i), pos=19+239*(1-p/100); mark.setAttribute('d',`M28 ${pos.toFixed(1)}H137`);text.setAttribute('y',Math.max(22,pos-5).toFixed(1));text.textContent=`${Math.round(p)}%`;models.children[i].classList.remove('has-result');}}
 function redraw(s,init=true){modulesView(s);s.modules.forEach((_,i)=>level(i,s.percent,init));$('state').textContent=`${s.modules.length} ${s.modules.length===1?'memoria detectada':'memorias detectadas'} · ${fmt(s.totalGiB)} GiB`;$('note').textContent=`${fmt(s.usedGiB)} GiB utilizados · ${fmt(s.totalGiB)} GiB totales`}
 function markState(status,mode){$('connection').textContent=status;$('led').className='indicator'+(mode?' '+mode:'');$('announcer').textContent=status}
 async function fetchApi(route,post=false){const c=new AbortController();const timer=setTimeout(()=>c.abort(),post?180000:3800);try{const r=await fetch(API+route,{method:post?'POST':'GET',mode:'cors',cache:'no-store',signal:c.signal,...(post?{headers:{'Content-Type':'text/plain'},body:'liberar=1'}:{})});if(!r.ok)throw Error('Servidor: '+r.status);const d=await r.json();if(d.ok!==true)throw Error(d.error||'Sin autorización');return d;}finally{clearTimeout(timer)}}
 async function refresh(){if(busy)return;if(demo){const d={totalGiB:16,usedGiB:11.84,percent:74,availableGiB:4.16,modules:[{capacityGiB:8,locator:'DIMM A1'},{capacityGiB:8,locator:'DIMM B1'}]};snapshot=normalize(d);redraw(snapshot);connected=false;markState('Muestra · datos de ejemplo','demo');$('delta').textContent='—';$('detail').textContent='Listo para visualizar';return}
 try{await connect()}catch(err){connected=false;snapshot=null;models.dataset.key='';models.replaceChildren();modulesView({modules:[{capacityGiB:0,locator:'Requiere conexión con Windows'}]});$('state').textContent='Esperando lectura real';markState('Sin conexión');$('note').textContent='Para Windows: componente local autorizado';$('delta').textContent='—';$('detail').textContent='Sin medición';}}
 async function connect(){const d=await fetchApi('/api/estado');snapshot=normalize(d);connected=true;redraw(snapshot);markState('Windows conectado','ok');$('delta').textContent='—';$('detail').textContent='Listo para analizar';return true;}
 async function visualize(before,after){busy=true;button.disabled=true;board.classList.add('transfer');beginning=before;modulesView(before);before.modules.forEach((_,i)=>{level(i,before.percent,true);models.children[i].classList.add('vapor')});$('result').classList.remove('nochange');$('delta').textContent='···';$('detail').textContent='Analizando cambios';$('note').textContent='Comparación de memoria global del sistema';await sleep(reduced.matches?40:520);before.modules.forEach((_,i)=>{models.children[i].classList.add('has-result');level(i,after.percent,false)});await sleep(reduced.matches?40:2400);const freed=before.usedGiB-after.usedGiB, sign=freed>0?'+':'';$('delta').textContent=`${sign}${fmt(freed)} GiB`;$('detail').textContent=freed>0.025?'Reducción medida de RAM utilizada':freed<-.025?'Aumento de RAM utilizada':'Sin variación apreciable';$('result').classList.toggle('nochange',freed<=.025);$('note').textContent=`Antes: ${Math.round(before.percent)}% · Después: ${Math.round(after.percent)}%`;models.children.length&&[...models.children].forEach(x=>x.classList.remove('vapor'));await sleep(reduced.matches?30:1350);board.classList.remove('transfer');busy=false;button.disabled=false;snapshot=after}
 async function runRelease(){
  if(busy||!connected)return;
  busy=true;button.disabled=true;markState('Esperando confirmación…','ok');let before=snapshot;
  try{
    const reply=await fetchApi('/api/liberar',true);
    if(!reply.approved){markState('Operación cancelada','ok');$('detail').textContent='No se realizó ninguna acción';return}
    before=normalize(reply.before);const after=normalize(reply.after);
    markState('Medición completada','ok');await visualize(before,after);
    $('detail').textContent+=` · ${Number(reply.trimmed)||0} procesos tratados`;
    if(reply.trimmed===0)$('detail').textContent='No hubo procesos aptos para intervenir';
  }catch(e){
    markState('Error de comunicación');
    modal('No se completó',`<p>${e.name==='AbortError'?'Windows no respondió dentro del tiempo previsto.':'Compruebe la conexión local y los permisos del navegador.'}</p>`,[{text:'Cerrar',action:close}]);
  }finally{busy=false;button.disabled=false;board.classList.remove('transfer');[...models.children].forEach(x=>x.classList.remove('vapor'))}
 }
 button.addEventListener('click',async()=>{
  if(busy)return;
  if(demo){if(!snapshot)await refresh();markState('Animación de demostración','demo');const b=snapshot,a=normalize({...b,usedGiB:7.36,percent:46,availableGiB:8.64});await visualize(b,a);snapshot=b;return}
  if(!connected){try{await connect()}catch(e){setup();return}}
  await runRelease();
 });
 $('refresh').addEventListener('click',()=>{models.dataset.key='';refresh()});refresh();})();
</script>
</body>
