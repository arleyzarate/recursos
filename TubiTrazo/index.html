<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9fbfc">
<meta name="description" content="TubiTrazo: editor de isométricos de tubería, accesorios y soportes con propiedades, filtros y tablas de materiales.">
<title>TubiTrazo · v1.0.0</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main id="workspace">
<svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lienzo isométrico interactivo">
 <g id="ttWatermark" pointer-events="none" aria-hidden="true" opacity="0.18">
  <g transform="translate(-139,1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 15L14 3L37 16" stroke="#118fa0" stroke-width="8"/>
    <path d="M14 3V-19" stroke="#e47537" stroke-width="8"/>
    <path d="M37 16L51 8" stroke="#26a36d" stroke-width="8"/>
    <circle cx="14" cy="3" r="5.5" fill="#0e6e83" stroke="#fff" stroke-width="1.3"/>
  </g>
  <text x="-77" y="15" text-anchor="start" font-family="Arial,system-ui,sans-serif" font-weight="900" font-size="47" letter-spacing="-1"><tspan fill="#128999">Tubi</tspan><tspan fill="#e4763b">Tra</tspan><tspan fill="#2c9b69">zo</tspan></text>
 </g>
 <g id="camera"><g id="gridLayer"></g><g id="guideLayer"></g><g id="aidLayer"></g><g id="subsoilLayer"></g><g id="sceneLayer"></g><g id="supportReferenceLayer"></g><g id="reducerPreviewLayer"></g><g id="draftLayer"></g><g id="marqueeLayer"></g><g id="moveLayer"></g><g id="copyLayer"></g></g>
</svg>


<header id="topDock">
<section id="projectActions" aria-label="Archivo e historial">
<button id="resetTool" class="iconbtn" title="Nuevo ensamble" aria-label="Crear nuevo ensamble">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 4H20L25 9V27H8Z M20 4V10H25 M12 18H21 M16.5 13.5V22.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>NUEVO</span>
</button>
<button id="undoTool" class="iconbtn" title="Deshacer (20 pasos)" aria-label="Deshacer" disabled>
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M12 8L4 16L12 24M5 16H20C27 16 28 26 23 28" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>DESHACER</span>
</button>
<button id="redoTool" class="iconbtn" title="Rehacer (20 pasos)" aria-label="Rehacer" disabled>
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M20 8L28 16L20 24M27 16H12C5 16 4 26 9 28" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>REHACER</span>
</button>
<button id="saveTool" class="iconbtn" title="Guardar el ensamble y descargar respaldo JSON" aria-label="Guardar ensamble en memoria" type="button">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M11 4H21V12H11Z M8 12H24V28H8Z" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/><path d="M14 7V9M18 7V9M12 18H20M12 22H18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="21" cy="24" r="1.2" fill="currentColor"/></svg><span>GUARDAR</span>
</button>
<button id="projectConfigTool" class="iconbtn" type="button" title="Configuración del proyecto" aria-label="Configuración del proyecto">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M13 3H19L20 7L24 9L28 7L31 13L27 16L28 20L31 23L27 29L23 26L20 27L19 31H13L12 27L9 26L5 29L1 23L5 20L5 16L1 13L5 7L9 9L12 7Z" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="17" r="4.6" stroke="currentColor" stroke-width="2"/></svg><span>CONFIG.</span>
</button>
</section>
<nav id="toolBar" aria-label="Trazado de tuberías">
<button id="pipeTool" class="iconbtn" title="Activar o desactivar trazado de tubería" aria-label="Tubería" aria-pressed="false">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 16H28" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M4 10V22M28 10V22" stroke="currentColor" stroke-width="1.7"/></svg><span>TUBO</span>
</button>
<button id="reducerTool" class="iconbtn" title="Elegir ubicación y después configurar reducción" aria-label="Insertar reducción: elegir punto y después diámetro" aria-pressed="false">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M3 8H9L23 13V19L9 24H3Z" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M23 13H29V19H23" stroke="currentColor" stroke-width="2.2"/></svg><span>REDUC.</span>
</button>
</nav>
</header>



<footer id="bottomDock" aria-label="Herramientas y plano de trabajo">
<div id="planeDock">
 <button id="axisButton" class="iconbtn" type="button" title="Cambiar plano de trabajo" aria-label="Plano horizontal XY. Tocar para cambiar a vertical" aria-pressed="false">
  <svg id="planeGlyph" viewBox="0 0 70 50" aria-hidden="true">
    <g class="axis-x" stroke="#dd4c4c" fill="#dd4c4c"><path d="M20 30 L48 45" stroke-width="3.5" stroke-linecap="round"/><text x="52" y="48" font-size="13" font-weight="700" stroke="none">X</text></g>
    <g class="axis-y" stroke="#279858" fill="#279858"><path d="M20 30 L48 15" stroke-width="3.5" stroke-linecap="round"/><text x="51" y="15" font-size="13" font-weight="700" stroke="none">Y</text></g>
    <g class="axis-z" stroke="#337adb" fill="#337adb"><path d="M20 30 L20 4" stroke-width="3.5" stroke-linecap="round"/><text x="12" y="11" font-size="13" font-weight="700" stroke="none">Z</text></g>
    <circle cx="20" cy="30" r="3.2" fill="#2d3e44"/>
  </svg><span id="planeCaption">Horizontal</span>
 </button>
 <div id="planeChoices" hidden aria-hidden="true"></div>
</div>
<section id="editingDock" aria-label="Edición de elementos">
<button id="unitsTool" class="iconbtn" title="Cambiar unidades" aria-label="Cambiar unidades de longitud" type="button"><svg viewBox="0 0 32 32" aria-hidden="true" fill="none"><path d="M5 21V10M5 21H26M5 10l-2 3M5 10l2 3M26 21l-3-2M26 21l-3 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 17l3-3m0 0h-3m3 0v3" stroke="currentColor" stroke-width="1.8"/></svg><span id="unitCaption">mm</span></button>
<button id="tablesTool" class="iconbtn" type="button" title="Materiales, cortes, soldaduras, soportes y equipos" aria-label="Abrir tablas">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 6H27V26H5Z M5 13H27 M5 19.5H27 M13 6V26" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>TABLAS</span>
</button>
<button id="attributesTool" class="iconbtn" type="button" title="Propiedades generales y por elemento" aria-label="Propiedades técnicas">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 4H21L26 9V27H8Z M21 4V10H26 M12 15H22 M12 20H20 M12 24H18" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>PROPIED.</span>
</button>
<button id="supportTool" class="iconbtn" type="button" title="Insertar soporte metálico o dado de concreto" aria-label="Insertar soporte" aria-pressed="false">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M4 8H28M16 8V22M7 26H25M11 22L16 26L21 22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>SOPORTE</span>
</button>
<button id="filterTool" class="iconbtn" title="Filtro de selección" aria-label="Filtro de selección" aria-expanded="false">
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 7H27L19 16V24L13 27V16L5 7Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><span>FILTRO</span>
</button>
<button id="deleteTool" class="iconbtn" title="Borrar extremos o retirar codo/T" aria-label="Borrar elemento seleccionado" disabled>
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 9H24M12 9V6H20V9M10 11L11 27H21L22 11M15 14V23M18 14V23" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round"/></svg><span>BORRAR</span>
</button>
<button id="colorTool" class="iconbtn" title="Asignar color de servicio a la selección" aria-label="Color por servicio" disabled>
 <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M7 21L17 5L28 16L18 27H7Z" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/><path d="M12 21L21 12" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="26" r="2.2" fill="currentColor"/></svg><span>COLOR</span>
</button>
<button id="copyTool" class="iconbtn" title="Copiar selección individual o múltiple" aria-label="Copiar elementos seleccionados" aria-pressed="false" disabled>
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="11" y="10" width="17" height="18" rx="2" stroke="currentColor" stroke-width="2.1"/><path d="M21 10V6C21 4.9 20.1 4 19 4H6C4.9 4 4 4.9 4 6V20C4 21.1 4.9 22 6 22H11" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/></svg><span>COPIAR</span>
</button>
<button id="moveTool" class="iconbtn" title="Mover tramo recto o accesorio" aria-label="Mover tramo o accesorio" aria-pressed="false">
<svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3V29M3 16H29M16 3l-5 5M16 3l5 5M16 29l-5-5M16 29l5-5M3 16l5-5M3 16l5 5M29 16l-5-5M29 16l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>MOVER</span>
</button>
</section>
</footer>

<div id="unitsMenu" hidden aria-label="Unidades de longitud"><button type="button" data-unit="mm">mm · Milímetros</button><button type="button" data-unit="m">m · Metros</button><button type="button" data-unit="ft">ft · Pies</button><button type="button" data-unit="in">in · Pulgadas</button><button type="button" id="projectSettings" hidden aria-hidden="true">Proyecto</button></div>
<div id="filterMenu" aria-label="Filtro de selección">
 
 <button class="filterOption" data-filter="assembly"><strong>Ensamble</strong><small>Selecciona todo el dibujo</small></button>
 <button class="filterOption" data-filter="diameter"><strong>Diámetro</strong><small>Selecciona por diámetro</small></button>
 <button class="filterOption" data-filter="material"><strong>Material</strong><small>Selecciona tubos por material</small></button><button class="filterOption" data-filter="line"><strong>Número de línea</strong><small>Filtra por referencia de línea</small></button>
 <button class="filterOption" data-filter="flow"><strong>Flujo</strong><small>Toque un tubo; se detiene en bifurcaciones</small></button>
</div>











<div id="selectionActions" hidden aria-label="Acciones de selección">
<button type="button" id="selCancel" class="select-action" aria-label="Limpiar selección" title="Cancelar selección"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 8L24 24M24 8L8 24" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/></svg><span>Salir</span></button>
<button type="button" id="selProperties" class="select-action" aria-label="Abrir propiedades" title="Propiedades"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 4H20L25 9V28H8Z M19 4V10H25 M12 16H21M12 20H21M12 24H18" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span>Prop.</span></button>
<button type="button" id="selCopy" class="select-action" aria-label="Copiar selección" title="Copiar"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="9" y="9" width="18" height="19" rx="2" stroke="currentColor" stroke-width="2.3"/><path d="M22 8V5H5V23H8" stroke="currentColor" stroke-width="2.3"/></svg><span>Copiar</span></button>
<button type="button" id="selMove" class="select-action" aria-label="Mover selección" title="Mover"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 2V30M2 16H30M16 2L12 7M16 2L20 7M16 30L12 25M16 30L20 25M2 16L7 12M2 16L7 20M30 16L25 12M30 16L25 20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Mover</span></button>
</div>
<div id="decisions" hidden><button id="cancel" class="iconbtn" aria-label="Cancelar" title="Cancelar" disabled><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M8 8L24 24M24 8L8 24" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button><button id="confirm" class="iconbtn" aria-label="Confirmar" title="Confirmar" disabled><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M6 17L13 24L27 8" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
<section id="tablesPanel" role="dialog" aria-modal="false" aria-label="Tablas del ensamble" hidden>
 <div class="tables-heading"><b>Tablas del ensamble</b><button type="button" id="tablesAggregationToggle" class="tt-total-toggle" aria-label="Cambiar vista de total a individual" title="Alternar Total / Individual">∑ Total</button><button id="closeTables" class="tables-close" type="button" aria-label="Cerrar tablas">×</button></div>
 <div class="table-tabs" role="tablist" aria-label="Tipo de tabla"><button data-table="lines" class="active" type="button">Líneas</button><button data-table="materials" type="button">Materiales</button><button data-table="cuts" type="button">Cortes</button><button data-table="welds" type="button">Soldaduras</button><button data-table="supports" type="button">Soportes</button><button data-table="equipment" type="button">Equipos</button></div>
 <div id="tablesContent"></div>
</section>
<section id="propertyPanel" role="dialog" aria-label="Propiedades de selección" hidden><header id="panelTitle"></header><div id="panelBody"></div></section>
<div id="copyActions" aria-label="Confirmar ubicación de la copia" hidden>
 <button id="copyCancel" class="iconbtn" title="Cancelar copia" aria-label="Cancelar copia" type="button">
   <svg viewBox="0 0 32 32" fill="none"><path d="M8 8L24 24M24 8L8 24" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/></svg>
 </button>
 <button id="copyApply" class="iconbtn" title="Aplicar copia" aria-label="Aplicar copia" type="button">
   <svg viewBox="0 0 32 32" fill="none"><path d="M5 17L13 24L27 8" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
 </button>
</div>
<section id="dimensionsPanel" aria-label="Catálogo de dimensiones" role="dialog" hidden>
 <div class="head"><strong>Dimensiones del componente</strong><button type="button" id="closeDimensions" aria-label="Cerrar dimensiones">×</button></div>
 <p>Valores reales definidos por el proyecto o el fabricante. La geometría gráfica no determina las longitudes.</p>
 <div id="dimensionsContent"></div>
</section>
<div id="tip" aria-live="polite">Active el ícono de tubo para comenzar a dibujar.</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="copyright">Diseño: Arley Zarate · v1.0.0</div>
</main>
<script src="catalogos.js"></script>
<script src="aplicacion.js"></script>
</body>
</html>
