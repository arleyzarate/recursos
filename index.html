<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Recursos | Arley Zarate. Herramientas y archivos con búsqueda en tiempo real.">
  <title>Recursos | Arley Zarate</title>
  <style>
    :root { color-scheme: dark; --fondo: #09090b; --acento: #90ffe0; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background-color: var(--fondo);
      transition: background-color 1.5s ease;
      color: #f4f7fc;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }
    .lluvia { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .columna {
      position: absolute; top: 0; display: flex; flex-direction: column; align-items: center;
      width: 1.4em; white-space: pre;
      font: 500 var(--tam, 14px)/1.42 Consolas, "Cascadia Code", monospace;
      color: var(--acento);
      text-shadow: 0 0 11px rgba(100, 255, 214, .45);
      opacity: var(--opacidad, .5);
      will-change: transform;
      animation: subir var(--duracion, 28s) linear infinite;
      animation-delay: var(--retraso, -10s);
    }
    .letra { display: block; min-height: 1.42em; }
    .letra.brillante { color: #ddfff5; font-weight: 700; text-shadow: 0 0 13px rgba(148,255,224,.83); }
    .letra.separador { opacity: .22; }
    @keyframes subir {
      from { transform: translate3d(0, 110vh, 0); }
      to   { transform: translate3d(0, -130%, 0); }
    }
    .pagina {
      min-height: 100svh; position: relative; z-index: 1;
      padding: clamp(18px, 3vw, 45px);
      display: grid; grid-template-rows: auto 1fr auto;
    }
    .cabecera, .pie { font-size: 11px; font-weight: 700; letter-spacing: .19em; color: #bdd3da; }
    .cabecera { display: flex; align-items: center; gap: 10px; }
    .logotipo {
      display: grid; place-items: center; width: 29px; height: 29px;
      border: 1px solid #87e9d6; border-radius: 9px; color: #b1fff0;
      background: #0e1b25; font-size: 14px;
    }
    .centro { width: min(690px, 100%); justify-self: center; align-self: center; transform: translateY(-8%); }
    h1 {
      margin: 0 0 48px; text-align: center;
      font-size: clamp(48px, 8vw, 88px); line-height: 1.05;
      font-weight: 700; letter-spacing: -.062em;
      text-shadow: 0 6px 35px rgba(0,0,0,.85);
    }
    .comandos {
      position: relative; display: flex; align-items: center; gap: 12px;
      min-height: 79px; padding: 8px 12px;
      border: 1px solid rgba(146, 235, 220, .37); border-radius: 18px;
      background: rgba(6, 16, 24, .9);
      box-shadow: 0 18px 64px rgba(0,0,0,.48), inset 0 1px rgba(255,255,255,.055);
      backdrop-filter: blur(13px);
    }
    .etiqueta {
      position: absolute; left: 22px; top: -13px;
      padding: 5px 11px; background: #0b2126;
      border: 1px solid rgba(116, 241, 207, .43); border-radius: 7px;
      color: #a7ffe3; box-shadow: 0 7px 18px rgba(0,0,0,.4);
      font: 700 11px/1.2 Consolas, monospace; letter-spacing: .07em;
      animation: flotar 3.8s ease-in-out infinite;
    }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .simbolo { padding-left: 13px; font: 700 25px Consolas, monospace; color: #8ff1cf; }
    #comando {
      min-width: 0; flex: 1; padding: 12px 3px; background: transparent;
      outline: none; border: none; color: #fbfffe; caret-color: #96ffda;
      font: 500 clamp(16px, 2vw, 19px) "Segoe UI", system-ui, sans-serif;
    }
    #comando::placeholder { color: #8a9eaa; opacity: 1; }
    .abrir {
      flex: 0 0 auto; width: 48px; height: 48px;
      border-radius: 11px; border: 1px solid rgba(144, 244, 209, .34);
      background: rgba(65, 183, 150, .18); color: #c5ffec;
      font-size: 21px; cursor: pointer; transition: background .2s ease;
    }
    .abrir:hover, .abrir:focus-visible { background: rgba(90, 219, 174, .34); outline: 2px solid rgba(176,255,216,.32); }
    .estado {
      min-height: 28px; padding-top: 12px; text-align: center;
      font: 600 13px/1.4 "Segoe UI", system-ui, sans-serif;
      letter-spacing: .015em;
      color: transparent;
      text-shadow: 0 2px 15px rgba(0,0,0,.6);
    }
    .estado.correcto { color: #a7ffe0; }
    .estado.error { color: #ffb2b4; }
    .pie { font-size: 10px; text-align: left; letter-spacing: .08em; font-weight: 500; }
    @media (max-width: 560px) {
      .pagina { padding: 20px 15px; }
      .centro { transform: translateY(-5%); }
      h1 { margin-bottom: 42px; }
      .comandos { min-height: 67px; padding: 7px; gap: 6px; }
      .etiqueta { left: 15px; }
      .simbolo { padding-left: 9px; }
      .abrir { width: 43px; height: 43px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .columna, .etiqueta { animation: none; }
      body { transition: none; }
    }
  
    /* La interfaz deja solamente el nombre, el comando y los resultados. */
    .pagina { display: flex; align-items: center; justify-content: center; }
    .centro { width: min(720px,100%); align-self: auto; justify-self: auto; transform: translateY(-7%); }
    .comandos { z-index: 3; }
    .etiqueta { display: none; }
    #comando { position: relative; z-index: 1; }
    .indicacion {
      position: absolute; pointer-events: none; user-select: none;
      left: 64px; right: 69px; top: 50%; transform: translateY(-50%);
      font: 500 clamp(16px, 2vw, 19px) "Segoe UI",system-ui,sans-serif;
      color: #9eb4c3; white-space: nowrap; overflow: hidden;
    }
    .cursor-parpadeo { color: #8fffd5; font-family: Consolas,monospace; font-weight: 700; animation: parpadear 1s steps(1) infinite; }
    @keyframes parpadear { 0%, 49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .indicacion.oculta { display: none; }
    .etiqueta-oculta { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .panel-resultados { position: relative; z-index: 2; }
    .resultados {
      position: absolute; top: 8px; left: 0; right: 0;
      max-height: min(330px, 44vh); overflow-y: auto;
      background: rgba(7,17,26,.975); border: 1px solid rgba(121,231,202,.35);
      border-radius: 15px; padding: 7px;
      box-shadow: 0 16px 54px rgba(0,0,0,.53); backdrop-filter: blur(18px);
      scrollbar-color: #386d66 transparent;
    }
    .resultados[hidden], .modal[hidden] { display: none !important; }
    .resultado {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: #f0f9f8; background: transparent; border: none; border-radius: 9px;
      cursor: pointer; font: 500 14px/1.35 "Segoe UI",system-ui,sans-serif;
      text-align: left; padding: 10px 12px;
    }
    .resultado:hover, .resultado.activo { background: #183c40; }
    .resultado .archivo { overflow: hidden; overflow-wrap: anywhere; }
    .resultado mark { color: #0e1820; background: #b4fbe1; border-radius: 3px; padding: 0 2px; }
    .resultado .accion { color: #abf7df; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .estado { min-height: 31px; }
    .estado.info { color: #b2c7d1; }
    .modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 18px; background: rgba(0,0,0,.72); backdrop-filter: blur(6px); }
    .cuadro-modal { width: min(460px,100%); padding: 27px; border-radius: 19px; border: 1px solid #3c746b; background: #0b1b25; box-shadow: 0 18px 70px #000b; }
    .cuadro-modal h2 { margin: 0 0 12px; font-size: 20px; line-height: 1.35; font-weight: 700; }
    .cuadro-modal p { line-height: 1.5; font-size: 15px; overflow-wrap: anywhere; color: #d4e2e4; }
    .botones-modal { display: flex; gap: 11px; justify-content: flex-end; margin-top: 25px; }
    .botones-modal button { padding: 11px 17px; border-radius: 9px; border: 1px solid #47766d; font: 600 14px "Segoe UI", sans-serif; color: #f1fffa; background: #18353b; cursor: pointer; }
    .botones-modal .confirmar { background: #227b64; color: white; border-color: #41a688; }
    .botones-modal button:focus-visible, .resultado:focus-visible { outline: 2px solid #9dffdc; }
    @media (max-width:560px) {
      .centro { transform: translateY(-6%); }
      .indicacion { left: 49px; right: 55px; }
      .resultado { padding: 10px 8px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) { .cursor-parpadeo { animation: none; } }
</style>
</head>
<body>
  <script src="palabras.js"></script>
  <script src="archivos.js"></script>
  <div id="lluvia" class="lluvia" aria-hidden="true"></div>
  <div class="pagina">
    <main class="centro">
      <h1>Arley Zarate</h1>
      <form class="comandos" id="formulario" autocomplete="off">
        <label for="comando" class="etiqueta-oculta">Ingrese comando</label>
        <span class="simbolo" aria-hidden="true">&gt;</span>
        <input type="text" id="comando" name="comando" role="combobox" aria-autocomplete="list"
          aria-expanded="false" aria-controls="resultados" aria-describedby="estado" spellcheck="false" autofocus>
        <span id="indicacion" class="indicacion" aria-hidden="true">Ingrese comando<span class="cursor-parpadeo">_</span></span>
        <button class="abrir" type="submit" aria-label="Abrir resultado" title="Abrir resultado">↗</button>
      </form>
      <div class="panel-resultados"><div id="resultados" class="resultados" role="listbox" aria-label="Archivos encontrados" hidden></div></div>
      <div class="estado" id="estado" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
  </div>
  <div id="modal" class="modal" hidden>
    <section class="cuadro-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal" aria-describedby="nombre-descarga">
      <h2 id="titulo-modal">¿Desea descargar este archivo?</h2>
      <p id="nombre-descarga"></p>
      <div class="botones-modal">
        <button id="descargar-no" type="button">No</button>
        <button id="descargar-si" type="button" class="confirmar">Sí, descargar</button>
      </div>
    </section>
  </div>
  <script>
    'use strict';
    // Los 10 tonos son colores sólidos; cambian cada 5 segundos sin intervención.
    const COLORES = [
      '#09090b', '#071b34', '#1a2436', '#0a2923', '#17183b',
      '#29152c', '#092b35', '#24282d', '#2d211c', '#102a2a'
    ];
    let indiceColor = 0;
    function cambiarColor() {
      document.documentElement.style.setProperty('--fondo', COLORES[indiceColor]);
      document.querySelector('meta[name="theme-color"]').content = COLORES[indiceColor];
      indiceColor = (indiceColor + 1) % COLORES.length;
    }
    cambiarColor();
    window.setInterval(cambiarColor, 5000);

    const palabras = (typeof window.RECURSOS_PALABRAS === 'string'
      ? window.RECURSOS_PALABRAS.split(',') : [])
      .map(x => x.trim()).filter(Boolean);
    if (!palabras.length) palabras.push('Recursos', 'AutoCAD', 'Excel', 'Smart3D', 'Ingeniería', 'Diseño');
    const lluvia = document.getElementById('lluvia');
    let ajustar;
    function generarLluvia() {
      lluvia.replaceChildren();
      const columnas = Math.min(60, Math.max(12, Math.round(window.innerWidth / 29)));
      const fragmento = document.createDocumentFragment();
      for (let i = 0; i < columnas; i++) {
        const nodo = document.createElement('div');
        nodo.className = 'columna';
        nodo.style.left = `${(i + .5) * 100 / columnas}%`;
        nodo.style.setProperty('--tam', `${Math.round(12 + Math.random() * 5)}px`);
        nodo.style.setProperty('--opacidad', (0.27 + Math.random() * .48).toFixed(2));
        nodo.style.setProperty('--duracion', `${(20 + Math.random() * 27).toFixed(1)}s`);
        nodo.style.setProperty('--retraso', `${(-Math.random() * 47).toFixed(1)}s`);
        let cadena = '';
        while (cadena.length < 50) cadena += palabras[Math.floor(Math.random() * palabras.length)] + ' ';
        [...cadena.slice(0, 54)].forEach((caracter, posicion) => {
          const letra = document.createElement('span');
          letra.className = 'letra';
          if (caracter === ' ') letra.classList.add('separador');
          else if (posicion % 13 === 0 || cadena[posicion - 1] === ' ') letra.classList.add('brillante');
          letra.textContent = caracter === ' ' ? '·' : caracter;
          nodo.appendChild(letra);
        });
        fragmento.appendChild(nodo);
      }
      lluvia.appendChild(fragmento);
    }
    generarLluvia();
    window.addEventListener('resize', () => {
      clearTimeout(ajustar);
      ajustar = setTimeout(generarLluvia, 180);
    });


    const formulario = document.getElementById('formulario');
    const entrada = document.getElementById('comando');
    const estado = document.getElementById('estado');
    const resultados = document.getElementById('resultados');
    const indicacion = document.getElementById('indicacion');
    const modal = document.getElementById('modal');
    const nombreDescarga = document.getElementById('nombre-descarga');
    const botonSi = document.getElementById('descargar-si');
    const botonNo = document.getElementById('descargar-no');

    // Solo se muestra el contenido del directorio publicado, nunca de subcarpetas.
    // Opcional para dominios propios, repositorios con estructura particular o fuente personalizada.
    // Deje las cadenas vacías para detectar automáticamente una página *.github.io.
    const CONFIG_GITHUB = {
      usuario: '',
      repositorio: '',
      carpeta: '',
      rama: ''
    };

    const EXCLUIDOS = /^(?:index(?:\.|$)|leame(?:[._\- ]|$)|readme(?:[._\- ]|$)|actualizar(?:[._\- ]|$)|archivos(?:[._\- ]|$)|archivos_archivos(?:[._\- ]|$)|palabras(?:[._\- ]|$)|catalogo(?:[._\- ]|$)|license(?:\.|$)|\.nojekyll$|\.gitignore$|\.ds_store$|recursos_web_arley_zarate(?:[._\- ]|$))/i;
    const normalizar = texto => String(texto || '').normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('es-CO');
    const simplificar = texto => normalizar(texto).replace(/[\s_\-]+/g, '');
    const esHTML = nombre => /\.html?$/i.test(nombre);
    const esVisible = nombre => typeof nombre === 'string' && !!nombre &&
      !/[\\/\u0000-\u001f]/.test(nombre) && !nombre.startsWith('.') &&
      !EXCLUIDOS.test(nombre);
    const rutaArchivo = nombre => './' + encodeURIComponent(nombre);
    const nombresLocales = Array.isArray(window.RECURSOS_ARCHIVOS) ? window.RECURSOS_ARCHIVOS : [];
    let catalogo = [];
    let cargando = true;
    let errorCatalogo = false;
    let coincidencias = [];
    let indiceActivo = -1;
    let archivoPendiente = null;

    function notificar(mensaje, tipo = '') {
      estado.textContent = mensaje;
      estado.className = 'estado' + (tipo ? ' ' + tipo : '');
    }
    function ocultarLista() {
      resultados.replaceChildren();
      resultados.hidden = true;
      entrada.setAttribute('aria-expanded', 'false');
      entrada.removeAttribute('aria-activedescendant');
      indiceActivo = -1;
    }
    function mostrarIndicacion() {
      indicacion.classList.toggle('oculta', entrada.value.length > 0);
    }
    function detectarRepositorio() {
      if (CONFIG_GITHUB.usuario && CONFIG_GITHUB.repositorio) {
        return { usuario: CONFIG_GITHUB.usuario, repositorio: CONFIG_GITHUB.repositorio };
      }
      const paginaGithub = location.hostname.match(/^([a-z\d-]+)\.github\.io$/i);
      if (!paginaGithub) return null;
      const usuario = paginaGithub[1];
      const directorios = location.pathname.split('/').filter(Boolean);
      const repositorio = directorios[0] && !/^index\.html?$/i.test(directorios[0])
        ? decodeURIComponent(directorios[0]) : usuario + '.github.io';
      return { usuario, repositorio };
    }
    async function pedirJSON(url) {
      const respuesta = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
      if (!respuesta.ok) throw new Error('GitHub API: ' + respuesta.status);
      return respuesta.json();
    }
    async function consultarGitHub(repo) {
      const base = 'https://api.github.com/repos/' + encodeURIComponent(repo.usuario)
        + '/' + encodeURIComponent(repo.repositorio);
      let carpeta = CONFIG_GITHUB.carpeta.replace(/^\/+|\/+$/g, '');
      let rama = CONFIG_GITHUB.rama;
      // Descubre la rama y /docs usados por GitHub Pages cuando la configuración es automática.
      if (!CONFIG_GITHUB.carpeta && !CONFIG_GITHUB.rama) {
        try {
          const informacion = await pedirJSON(base + '/pages');
          if (informacion && informacion.source) {
            carpeta = (informacion.source.path || '/').replace(/^\/+|\/+$/g, '');
            rama = informacion.source.branch || '';
          }
        } catch (_) { /* Puede estar publicado mediante GitHub Actions. */ }
      }
      const punto = carpeta ? '/' + carpeta.split('/').map(encodeURIComponent).join('/') : '';
      const url = base + '/contents' + punto + (rama ? '?ref=' + encodeURIComponent(rama) : '');
      const lista = await pedirJSON(url);
      if (!Array.isArray(lista)) throw new Error('El directorio no devolvió una lista de archivos.');
      // En caso de ser una publicación desde /docs sin dato de source, intentar /docs.
      if (!lista.some(f => f.name === 'index.html') && !carpeta && !CONFIG_GITHUB.carpeta) {
        try {
          const docs = await pedirJSON(base + '/contents/docs' + (rama ? '?ref=' + encodeURIComponent(rama) : ''));
          if (Array.isArray(docs) && docs.some(f => f.name === 'index.html')) {
            return docs.filter(f => f.type === 'file').map(f => f.name);
          }
        } catch (_) { /* Conserva la lista de la raíz. */ }
      }
      return lista.filter(f => f.type === 'file').map(f => f.name);
    }
    function catálogoFiltrado(nombres) {
      return [...new Set(nombres.filter(esVisible))].sort((a, b) =>
        a.localeCompare(b, 'es', { numeric: true, sensitivity: 'base' }));
    }
    async function cargarCatalogo() {
      const repo = detectarRepositorio();
      if (location.protocol === 'file:' || !repo) {
        catalogo = catálogoFiltrado(nombresLocales);
        cargando = false;
        errorCatalogo = catalogo.length === 0;
        actualizarResultados();
        return;
      }
      try {
        const remotos = await consultarGitHub(repo);
        catalogo = catálogoFiltrado(remotos);
      } catch (_) {
        catalogo = catálogoFiltrado(nombresLocales);
        errorCatalogo = catalogo.length === 0;
      } finally {
        cargando = false;
        actualizarResultados();
      }
    }
    function comparar(archivo, consulta) {
      const nombre = archivo.replace(/\.[^.]+$/, '');
      const texto = normalizar(archivo);
      const basico = normalizar(nombre);
      const buscado = normalizar(consulta).trim();
      const sinSeparador = simplificar(consulta);
      if (!buscado) return null;
      const coincide = texto.includes(buscado) || simplificar(archivo).includes(sinSeparador);
      if (!coincide) return null;
      let puntaje = 4;
      if (texto === buscado || basico === buscado) puntaje = 0;
      else if (basico.startsWith(buscado)) puntaje = 1;
      else if (basico.split(/[-_\s.]+/).some(x => x.startsWith(buscado))) puntaje = 2;
      else if (basico.includes(buscado)) puntaje = 3;
      return puntaje;
    }
    function marcarSeleccion(indice) {
      indiceActivo = indice;
      [...resultados.querySelectorAll('.resultado')].forEach((boton, i) => {
        const activo = i === indice;
        boton.classList.toggle('activo', activo);
        boton.setAttribute('aria-selected', String(activo));
        if (activo) {
          entrada.setAttribute('aria-activedescendant', boton.id);
          boton.scrollIntoView({ block: 'nearest' });
        }
      });
      if (indice === -1) entrada.removeAttribute('aria-activedescendant');
    }
    function insertarNombre(elemento, nombre, consulta) {
      // Todo el texto se crea como nodos, no como HTML proveniente de GitHub.
      const buscado = normalizar(consulta).trim();
      const index = normalizar(nombre).indexOf(buscado);
      if (index < 0 || !buscado) { elemento.textContent = nombre; return; }
      elemento.appendChild(document.createTextNode(nombre.slice(0, index)));
      const resaltado = document.createElement('mark');
      resaltado.textContent = nombre.slice(index, index + consulta.trim().length);
      elemento.appendChild(resaltado);
      elemento.appendChild(document.createTextNode(nombre.slice(index + consulta.trim().length)));
    }
    function actualizarResultados() {
      mostrarIndicacion();
      const consulta = entrada.value.trim();
      ocultarLista();
      coincidencias = [];
      if (!consulta || modal.hidden === false) return;
      if (cargando) { notificar('Consultando archivos…', 'info'); return; }
      if (errorCatalogo) {
        notificar('No se pudo consultar la lista de archivos. Revise la configuración.', 'error');
        return;
      }
      coincidencias = catalogo.map(nombre => ({ nombre, puntaje: comparar(nombre, consulta) }))
        .filter(item => item.puntaje !== null)
        .sort((a, b) => a.puntaje - b.puntaje || a.nombre.localeCompare(b.nombre, 'es', { sensitivity: 'base' }))
        .map(item => item.nombre);
      if (!coincidencias.length) { notificar('Sin coincidencias', 'info'); return; }
      notificar('', '');
      const fragmento = document.createDocumentFragment();
      coincidencias.forEach((nombre, indice) => {
        const opcion = document.createElement('button');
        opcion.type = 'button';
        opcion.className = 'resultado';
        opcion.id = 'resultado-' + indice;
        opcion.setAttribute('role', 'option');
        opcion.setAttribute('aria-selected', 'false');
        const titulo = document.createElement('span');
        titulo.className = 'archivo';
        insertarNombre(titulo, nombre, consulta);
        const accion = document.createElement('span');
        accion.className = 'accion';
        accion.textContent = esHTML(nombre) ? 'Abrir ↗' : 'Descargar ↓';
        opcion.append(titulo, accion);
        opcion.addEventListener('click', () => seleccionarArchivo(nombre));
        fragmento.appendChild(opcion);
      });
      resultados.appendChild(fragmento);
      resultados.hidden = false;
      entrada.setAttribute('aria-expanded', 'true');
    }
    function seleccionarArchivo(nombre) {
      entrada.value = nombre;
      mostrarIndicacion();
      ocultarLista();
      if (esHTML(nombre)) {
        const pestana = window.open(rutaArchivo(nombre), '_blank');
        if (!pestana) {
          notificar('El navegador bloqueó la pestaña nueva.', 'error');
          return;
        }
        try { pestana.opener = null; } catch (_) { /* Compatibilidad */ }
        notificar('Se abrió «' + nombre + '» en una pestaña nueva.', 'correcto');
        return;
      }
      archivoPendiente = nombre;
      nombreDescarga.textContent = nombre;
      modal.hidden = false;
      botonSi.focus();
    }
    function cerrarModal() {
      modal.hidden = true;
      archivoPendiente = null;
      entrada.focus();
    }
    botonNo.addEventListener('click', () => { cerrarModal(); notificar('Descarga cancelada.', 'info'); });
    botonSi.addEventListener('click', () => {
      if (!archivoPendiente) return;
      const nombre = archivoPendiente;
      const enlace = document.createElement('a');
      enlace.href = rutaArchivo(nombre);
      enlace.download = nombre;
      document.body.appendChild(enlace);
      enlace.click();
      enlace.remove();
      cerrarModal();
      notificar('Se solicitó la descarga de «' + nombre + '».', 'correcto');
    });
    modal.addEventListener('click', e => { if (e.target === modal) cerrarModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !modal.hidden) { e.preventDefault(); cerrarModal(); }
    });
    entrada.addEventListener('input', actualizarResultados);
    entrada.addEventListener('keydown', e => {
      if (resultados.hidden || !coincidencias.length) {
        if (e.key === 'Escape') ocultarLista();
        return;
      }
      if (e.key === 'ArrowDown') { e.preventDefault(); marcarSeleccion((indiceActivo + 1) % coincidencias.length); }
      if (e.key === 'ArrowUp') { e.preventDefault(); marcarSeleccion((indiceActivo - 1 + coincidencias.length) % coincidencias.length); }
      if (e.key === 'Escape') { e.preventDefault(); ocultarLista(); }
    });
    formulario.addEventListener('submit', e => {
      e.preventDefault();
      if (cargando) { notificar('Consultando archivos…', 'info'); return; }
      if (errorCatalogo) { notificar('No se pudo consultar la lista de archivos.', 'error'); return; }
      const elegido = coincidencias[indiceActivo >= 0 ? indiceActivo : 0];
      if (!elegido) { notificar('Error de comando', 'error'); return; }
      seleccionarArchivo(elegido);
    });
    cargarCatalogo();
  </script>
</body>
</html>
